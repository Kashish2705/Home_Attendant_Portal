<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f0f0f0;
        }

        h1 ,h2{
            margin-top:50px;
            color: rgb(54, 53, 53);
            text-align: center;
            padding: 5px;
            font-family: Arial, Helvetica, sans-serif;

        }

        h2{
            text-align:left;
            display:flex;
            justify-content: center;}
        .box1,
        .box2 {
            border-radius: 15px;
            background: white;
            padding: 80px;
            margin: 23px;
            box-shadow: 10px 10px 10px rgba(0, 0, 0, 0.1);
        }

        .both {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 50vh;
        }

        .b1,
        .b2 {
            padding: 30px 80px;
            border: none;
            border-radius: 10px;
            border-width: 10px;
            background-color: #007bff;
            color: white;
            font-size: 1.4rem;
            cursor: pointer;
            margin: 10px;

        }

        .b1:hover,
        .b2:hover {
            background-color: #0056b3;
            color: white;
            border-radius: 5px;
            transition-duration: 0.3s;
            box-shadow: 20px rgba(0, 0, 0, 0.1);
            border-color: rgb(0, 0, 0);
        }
    </style>

</head>

<body>
    <div class="head">
        <h1><u>Welcome back , you are logged in as : </u></h1>
       <h2>Name:<br>ID:<br>Time:</h2>
      
        <div class="both">
            <div class="box1">

                <button class="b1">Register Hospital</button>
            </div>
            <div class="box2">

                <button class="b2">Register Distributor</button>
            </div>
        </div>
    </div>
</body>

</html>
