<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Attendant Booking Service</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap');
        
        * {
            font-family: "Poppins", sans-serif;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #f4f4f4;
        }

        header {
            text-align: center;
            padding: 30px;
            background-color: bisque;
            font-weight: 800;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        section {
            width: 100%;
            max-width: 800px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }

        h2 {
            color: #333;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        a.invoice-link {
            color: #4CAF50;
            text-decoration: none;
        }

        a.invoice-link:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 10px;
            background-color: bisque;
            margin-top: 20px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <h1>Home Attendant Booking Service</h1>
    </header>

    <div class="container">
        <section id="bookings">
            <h2>Your Bookings</h2>
            <table id="bookingTable">
                <thead>
                    <tr>
                        <th>Attendant Name</th>
                        <th>Contact Number</th>
                        <th>Booking Date</th>
                        <th>Completion Date</th>
                        <th>Invoice</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Rows will be generated dynamically -->
                </tbody>
            </table>
        </section>
    </div>

    <footer>
        <p>&copy; 2024 Home Services. All rights reserved.</p>
    </footer>

    <script>
        // Class definition to manage bookings
        class Booking {
            constructor(attendantName, contactNumber, bookingDate, completionDate, invoiceURL) {
                this.attendantName = attendantName;
                this.contactNumber = contactNumber;
                this.bookingDate = bookingDate;
                this.completionDate = completionDate;
                this.invoiceURL = invoiceURL;
            }

            // Method to generate a table row for the booking
            generateTableRow() {
                return `
                    <tr>
                        <td>${this.attendantName}</td>
                        <td>${this.contactNumber}</td>
                        <td>${this.bookingDate}</td>
                        <td>${this.completionDate}</td>
                        <td><a href="${this.invoiceURL}" class="invoice-link" target="_blank">View Invoice</a></td>
                    </tr>
                `;
            }
        }

        // Sample data
        const bookings = [
            new Booking('Jane Doe', '(555) 123-4567', '2024-10-01', '2024-10-05', 'invoice_001.pdf'),
            new Booking('John Smith', '(555) 765-4321', '2024-10-10', '2024-10-15', 'invoice_002.pdf')
        ];

        // Populate the table
        const bookingTableBody = document.querySelector('#bookingTable tbody');
        bookings.forEach(booking => {
            bookingTableBody.innerHTML += booking.generateTableRow();
        });
    </script>
</body>
</html>
