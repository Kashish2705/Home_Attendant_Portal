<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIH</title>
    <link rel="stylesheet" href="vtop.css">
</head>
<body>
    <div class="table-responsive">
        
        <div class="profile">
            <div class="profile-header">
                <img class='img' src="minion.webp" alt="profile" class="profile-img"/>
                <div class="profile-text-container">
                  
                    <h1 class="profile-title">Organization/Hospital</h1>
                 
                </div>
            </div>
        <table class="table table-borderless border border-primary">
            <tbody>
                <tr>
                    <td class="header-cell">Owner Name</td>
                    <td class="value-cell" colspan="1">xxxxx</td>
                </tr>
                <tr>
                    <td class="header-cell">Company Name</td>
                    <td class="value-cell" colspan="1">ABC</td>
                </tr>
                <tr>
                    <td class="header-cell">License ID</td>
                    <td class="value-cell" colspan="1"></td>
                </tr>
                <tr>
                    <td class="header-cell">License Type</td>
                    <td class="value-cell" colspan="1">------</td>
                </tr>
                <tr>
                    <td class="header-cell">Phone no.</td>
                    <td class="value-cell" colspan="1">**********</td>
                </tr>
                <tr>
                    <td class="header-cell">Email</td>
                    <td class="value-cell" colspan="1">smthsmth@smth.com</td>
                </tr>
             <tr><th colspan="2"style='text-align:center;font-size:30px;'>Address</th></tr>
                <tr>
                    <td class="header-cell">Street name</td>
                    <td class="value-cell" colspan="1"></td>
                </tr>

                <tr>
                    <td class="header-cell">City</td>
                    <td class="value-cell" colspan="1"></td>
                </tr>


                <tr>
                    <td class="header-cell">State</td>
                    <td class="value-cell" colspan="1"></td>
                </tr>

                <tr>
                    <td class="header-cell">Landmark</td>
                    <td class="value-cell" colspan="1"></td>
                </tr>

                <tr><th colspan="2"style='text-align:center;font-size:30px;'>PAN Businesses</th></tr>
                
                <tr>
                    <td class="header-cell">Hospitals Registered</td>
                    <td class="value-cell" colspan="1"><details>
                        <summary>View Details</summary>
                        <p>Hospital 1</p>
                        <p>Hospital 2</p>
                        <p>Hospital 3</p>
                        <p>Hospital 4</p>
                        <p>Hospital 5</p>
                    </details></td>


                </tr>
                <tr><th colspan="2"><button class="btn-add">Add Hospital</button></th></tr>
                
            </tbody>
        </table>
    </div>
</body>
</html>
